<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalla feed lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f4fb; --surface: #ffffff; --ink: #171a33; --muted: #5f6488; --line: #dfe2f0;
  --accent: #3446f0; --accent-ink: #ffffff; --sun: #ffc533; --pos: #12805f; --neg: #c8323f;
  --soft: #eceefc; --shadow: 0 1px 2px rgba(23, 26, 51, .06), 0 6px 20px rgba(23, 26, 51, .05);
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1024; --surface: #171a38; --ink: #eceeff; --muted: #9aa0cc; --line: #2a2f5c;
    --accent: #8e9bff; --accent-ink: #0e1024; --pos: #3ecf9f; --neg: #ff7a85; --soft: #21254d;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0e1024; --surface: #171a38; --ink: #eceeff; --muted: #9aa0cc; --line: #2a2f5c;
  --accent: #8e9bff; --accent-ink: #0e1024; --pos: #3ecf9f; --neg: #ff7a85; --soft: #21254d;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.wordmark { font: 800 26px/1 var(--display); letter-spacing: -.03em; }
.wordmark i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); margin-left: 3px; }
.tag { color: var(--muted); font-size: 13px; }
.who { display: flex; gap: 8px; align-items: center; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--muted); }

.layout { display: grid; grid-template-columns: minmax(0, 580px) 340px; gap: 28px; justify-content: center; padding: 22px 20px 60px; max-width: 1000px; margin: 0 auto; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .learned { order: -1; } }

.feedbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
h1 { font: 800 28px/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 4px; }
.hint { margin: 0; color: var(--muted); font-size: 14px; max-width: 34ch; }
.primary { display: inline-flex; gap: 8px; align-items: center; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; white-space: nowrap; }
.primary b { background: var(--sun); color: #171a33; border-radius: 99px; min-width: 22px; padding: 0 6px; font-size: 12px; line-height: 22px; text-align: center; }
.primary.ready { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }

.feed { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.card.leaving { transition: opacity .25s, transform .25s, max-height .35s .1s, margin .35s .1s; opacity: 0; transform: scale(.97); max-height: 0 !important; margin-bottom: -16px; border-width: 0; }
.card.entering { animation: rise .4s both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.chead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 16px var(--display); flex: none; }
.who2 { line-height: 1.2; min-width: 0; }
.who2 strong { display: block; font-weight: 600; }
.who2 span { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.rankchip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.rankchip.up { color: var(--pos); background: color-mix(in srgb, var(--pos) 14%, transparent); }
.rankchip.down { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }
.follow { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 99px; padding: 4px 12px; font-weight: 600; font-size: 13px; }
.follow.on { border-color: var(--line); color: var(--muted); }

.media { position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center; overflow: hidden; }
.media .emoji { font-size: 84px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
.media .kind { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,.42); color: #fff; font-size: 12px; padding: 2px 9px; border-radius: 99px; }
.play { position: absolute; inset: auto 12px 12px 12px; display: flex; align-items: center; gap: 10px; }
.play button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; color: #171a33; display: grid; place-items: center; flex: none; }
.track { flex: 1; height: 5px; border-radius: 9px; background: rgba(255,255,255,.35); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: #fff; }
.time { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }

.cbody { padding: 12px 14px 4px; }
.caption { margin: 0 0 8px; font-weight: 500; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { font-size: 12.5px; color: var(--muted); background: var(--soft); border-radius: 99px; padding: 1px 9px; }
.why { margin: 0; font-size: 13px; color: var(--muted); }
.why b { color: var(--ink); font-weight: 600; }
details.score { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
details.score summary { cursor: pointer; width: fit-content; }
.calc { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 18px; width: fit-content; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.calc span:nth-child(even) { text-align: right; }
.calc .neg { color: var(--neg); }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px 8px 10px; position: relative; }
.act { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; border-radius: 10px; padding: 7px 10px; color: var(--muted); font-weight: 500; }
.act:hover { background: var(--soft); color: var(--ink); }
.act svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act.on { color: var(--accent); }
.act.like.on { color: var(--neg); }
.act.on svg { fill: currentColor; }
.act.text { font-size: 13.5px; }
.act[aria-expanded="true"] { background: var(--soft); color: var(--ink); }
.act[data-act="menu"] i { font-style: normal; font-size: 10px; margin-left: 2px; }

.why-menu { flex-basis: 100%; order: 1; margin: 4px 0 2px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: grid; gap: 2px; z-index: 5; animation: menuIn .15s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } }
.why-menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; width: 100%; }
.why-menu button:hover { background: var(--soft); }
.why-menu button b { font-size: 13.5px; font-weight: 600; }
.why-menu button small { font-size: 12px; color: var(--muted); }

.learned { align-self: start; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
.learned details { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.learned summary { list-style: none; cursor: pointer; padding: 14px 16px; font: 800 18px var(--display); letter-spacing: -.01em; }
.learned summary::-webkit-details-marker { display: none; }
.panel { padding: 0 16px 16px; }
h2 { font: 600 13px var(--body); color: var(--muted); margin: 14px 0 8px; }
.bars { display: grid; gap: 7px; }
.bars .empty, .log .empty { color: var(--muted); font-size: 13.5px; margin: 0; }
.row { position: relative; display: grid; grid-template-columns: 142px 1fr 40px; align-items: center; gap: 8px; font-size: 13.5px; border-radius: 8px; padding: 1px 0; }
.row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .lbl small { color: var(--muted); }
.track2 { position: relative; height: 8px; border-radius: 9px; background: var(--soft); }
.track2::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.track2 i { position: absolute; top: 0; bottom: 0; border-radius: 9px; transition: width .6s cubic-bezier(.2,.8,.2,1), left .6s cubic-bezier(.2,.8,.2,1); }
.row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.row .delta { position: absolute; right: 48px; top: -8px; font-size: 12px; font-weight: 700; animation: pop 2.6s both; pointer-events: none; }
@keyframes pop { 0% { opacity: 0; transform: translateY(6px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
.log li { padding-left: 12px; border-left: 3px solid var(--line); }
.log li.new { border-color: var(--accent); }
.log .d { color: var(--muted); display: block; font-size: 12.5px; }

.foot { color: var(--muted); font-size: 13px; text-align: center; margin: 22px 0 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark">Yalla<i></i></span><span class="tag">Feed lab · standalone demo</span></div>
  <div class="who">
    <label class="sr" for="user">Viewing as</label>
    <select id="user"></select>
    <button id="reset" class="ghost" title="Clear this user's history and learned preferences">Reset profile</button>
  </div>
</header>

<main class="layout">
  <section class="feedcol" aria-label="Feed">
    <div class="feedbar">
      <div>
        <h1>Your feed</h1>
        <p id="hint" class="hint">Like, watch or skip a post, then refresh the feed to see it re-rank.</p>
      </div>
      <button id="refresh" class="primary"><span>Refresh feed</span><b id="pending" hidden>0</b></button>
    </div>
    <div id="feed" class="feed"></div>
    <p class="foot">Videos play at 5× speed in this lab. Ranking is rule-based; no ML model.</p>
  </section>

  <aside class="learned" aria-label="What Yalla has learned">
    <details id="learnedbox" open>
      <summary>What Yalla has learned</summary>
      <div class="panel">
        <h2>Creators</h2>
        <div id="creators" class="bars"></div>
        <h2>Topics</h2>
        <div id="topics" class="bars"></div>
        <h2>Recent actions</h2>
        <ol id="log" class="log"></ol>
      </div>
    </details>
  </aside>
</main>

<script>
const __defs = {}; const __cache = {};
const __require = (n) => { n = n.replace(/^\.\/core\//, "./"); if (!__cache[n]) { const m = { exports: {} }; __defs[n](m, m.exports, __require); __cache[n] = m.exports; } return __cache[n]; };
__defs["./engine"] = function (module, exports, require) {
'use strict';
/**
 * Yalla recommendation engine — rule/score based, no ML.
 *
 * Pure functions only (no I/O), so it runs unchanged in Node and in the browser demo.
 *
 *   applyInteraction()  behaviour  -> updates creator / topic / content-type affinity
 *   rankFeed()          affinity   -> scored, sorted candidate posts (+ explanation)
 */

const CONFIG = {
  // Feed Score = Σ weight × component  −  seen penalty      (spec §10)
  weights: { creator: 0.3, topic: 0.25, watch: 0.2, engagement: 0.15, freshness: 0.1 },
  // Raw affinity is squashed with tanh(x / scale) into (-1, 1) so scores stay bounded
  // and negative affinity pushes content DOWN.
  scale: { creator: 8, topic: 8, type: 10 },
  freshnessHalfLifeHours: 72,
  seenPenalty: 0.1, // small: already-seen posts drift down, they don't vanish
  secondaryTopicFactor: 0.5, // 2nd+ topic on a post gets half the topic signal
  typeFactor: 0.4, // how much of the creator delta also trains photo/video preference
  quickSkipThreshold: 0.1, // a "watch" under 10% is really a swipe-away -> treated as skip
  affinityClamp: [-100, 100],
};

// Starting weights from the spec (§6). creator = creator affinity delta, topic = topic delta.
const SIGNALS = {
  view: { creator: 1, topic: 0.5 },
  like: { creator: 5, topic: 3 },
  unlike: { creator: -5, topic: -3 },
  share: { creator: 10, topic: 6 },
  save: { creator: 8, topic: 5 },
  comment: { creator: 7, topic: 4 },
  rewatch: { creator: 8, topic: 8 },
  follow: { creator: 10, topic: 0 },
  unfollow: { creator: -10, topic: 0 },
  skip: { creator: -3, topic: -3 },
  // Deliberately NOT combined like "skip" above: the person told us exactly which
  // dimension they meant, so only that one dimension moves. See applyInteraction().
  demote_topic: { creator: 0, topic: -10 },
  demote_creator: { creator: -10, topic: 0 },
  hide_plan: { creator: 0, topic: 0 }, // hides the post only; no score changes at all
  // "watch" is computed from completion, see signalFor()
};

const ACTIONS = [...Object.keys(SIGNALS), 'watch'];

// Related-topic graph: engaging with X also nudges these (spec §12: Football -> Sports).
const TOPIC_GRAPH = {
  football: { sports: 0.5 },
  'champions-league': { football: 0.7, sports: 0.5 },
  cricket: { sports: 0.5 },
  fitness: { sports: 0.4 },
  gaming: { technology: 0.2 },
};

/* ---------- helpers ---------- */
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const round = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;
const add = (map, key, d) => {
  map[key] = (map[key] || 0) + d;
};

function completionOf(watchTime, duration) {
  if (!duration || duration <= 0) return 0;
  return clamp((watchTime || 0) / duration, 0, 1);
}

/** Watch strength: +3 (barely watched) … +8 (90%+ completion). */
function watchStrength(completion) {
  return completion >= 0.9 ? 8 : 3 + 5 * completion;
}

/** Resolve an action (+ context) to { effective, creator, topic }. */
function signalFor(action, ctx = {}, cfg = CONFIG) {
  if (action === 'watch') {
    const c = completionOf(ctx.watchTime, ctx.contentDuration);
    if (c < cfg.quickSkipThreshold) return { effective: 'skip', ...SIGNALS.skip, completion: c };
    const s = round(watchStrength(c), 1);
    return { effective: 'watch', creator: s, topic: s, completion: c };
  }
  const s = SIGNALS[action];
  if (!s) return null;
  if (action === 'demote_topic') return { effective: action, ...s, topicKey: ctx.topic };
  return { effective: action, ...s };
}

function emptyProfile(userId) {
  return {
    userId,
    creatorAffinity: {},
    topicAffinity: {},
    typeAffinity: { photo: 0, video: 0 },
    creatorWatch: {}, // creatorId -> { n, sum }   (sum of completion ratios)
    updatedAt: null,
  };
}

/* ---------- learning ---------- */

/**
 * Update a user's profile from one interaction. Mutates `profile`, returns the deltas
 * (used by the UI to show "Ali +5, football +3").
 */
function applyInteraction(profile, post, action, ctx = {}, cfg = CONFIG, now = Date.now()) {
  const sig = signalFor(action, ctx, cfg);
  if (!sig) return null;
  const [lo, hi] = cfg.affinityClamp;
  const creatorId = post ? post.creatorId : ctx.creatorId;

  // These three are the "tell us why" menu actions: the person picked exactly one
  // dimension, so ONLY that dimension's map gets touched below — the other map is
  // never read or written, not even with a zero delta. That's the actual guarantee,
  // not just "the number happens to be zero."
  let creatorDelta = 0;
  let topicDeltas = {};

  if (sig.effective === 'hide_plan') {
    // No affinity change at all. Hiding is handled entirely via summarizeHistory()
    // (state.hidden) and the filter in rankFeed() — this call just records the event.
  } else if (sig.effective === 'demote_creator') {
    creatorDelta = sig.creator;
    profile.creatorAffinity[creatorId] = round(
      clamp((profile.creatorAffinity[creatorId] || 0) + creatorDelta, lo, hi)
    );
    // topicAffinity is intentionally never touched here.
  } else if (sig.effective === 'demote_topic') {
    const topic = sig.topicKey || (post && post.topics[0]);
    if (topic) {
      add(topicDeltas, topic, sig.topic);
      for (const [rel, w] of Object.entries(TOPIC_GRAPH[topic] || {})) {
        add(topicDeltas, rel, sig.topic * w);
      }
      for (const [t, d] of Object.entries(topicDeltas)) {
        topicDeltas[t] = round(d);
        profile.topicAffinity[t] = round(clamp((profile.topicAffinity[t] || 0) + d, lo, hi));
      }
    }
    // creatorAffinity is intentionally never touched here.
  } else {
    // Every other action (like, watch, skip, share...) is ambiguous behaviour, not a
    // stated intent — a single like IS evidence about both the creator and the topic
    // at once, so both update together here, same as before.
    creatorDelta = sig.creator;
    const topics = (post && post.topics) || [];
    topics.forEach((t, i) => {
      const d = sig.topic * (i === 0 ? 1 : cfg.secondaryTopicFactor);
      if (!d) return;
      add(topicDeltas, t, d);
      for (const [rel, w] of Object.entries(TOPIC_GRAPH[t] || {})) add(topicDeltas, rel, d * w);
    });
    profile.creatorAffinity[creatorId] = round(
      clamp((profile.creatorAffinity[creatorId] || 0) + creatorDelta, lo, hi)
    );
    for (const [t, d] of Object.entries(topicDeltas)) {
      topicDeltas[t] = round(d);
      profile.topicAffinity[t] = round(clamp((profile.topicAffinity[t] || 0) + d, lo, hi));
    }
  }

  // Content-type preference (photo vs video) — feeds the "engagement" component.
  // Only ambiguous, creator-linked actions train this; the three intent-specific
  // actions above never touch it either (demote_topic has creatorDelta===0, so it's
  // automatically excluded by the check below).
  let typeDelta = 0;
  if (post && creatorDelta && !['follow', 'unfollow'].includes(sig.effective)) {
    typeDelta = round(creatorDelta * cfg.typeFactor);
    profile.typeAffinity[post.type] = round(
      clamp((profile.typeAffinity[post.type] || 0) + typeDelta, lo, hi)
    );
  }

  if (sig.effective === 'watch' || sig.effective === 'rewatch') {
    const w = profile.creatorWatch[creatorId] || { n: 0, sum: 0 };
    w.n += 1;
    w.sum += sig.effective === 'rewatch' ? 1 : sig.completion;
    profile.creatorWatch[creatorId] = w;
  }

  profile.updatedAt = now;
  return {
    action,
    effective: sig.effective,
    completion: sig.completion,
    creatorId,
    creatorDelta: round(creatorDelta),
    topicDeltas,
    typeDelta,
  };
}

/* ---------- history helpers ---------- */

/** Collapse a user's interaction log into per-post state. */
function summarizeHistory(interactions) {
  const state = {};
  for (const it of interactions) {
    if (!it.postId) continue;
    const s = (state[it.postId] ||= {});
    switch (it.action) {
      case 'view': s.viewed = true; break;
      case 'like': s.liked = true; break;
      case 'unlike': s.liked = false; break;
      case 'save': s.saved = true; break;
      case 'share': s.shared = true; break;
      case 'comment': s.commented = true; break;
      case 'watch':
      case 'rewatch': s.watched = true; break;
      case 'skip': s.skipped = true; break;
      case 'hide_plan': s.hidden = true; break;
      case 'demote_topic': s.demotedTopic = it.topic || null; break;
      case 'demote_creator': s.demotedCreator = true; break;
    }
  }
  return state;
}

/* ---------- ranking ---------- */

function popularityRaw(stats = {}) {
  return Math.log1p((stats.likes || 0) + 3 * (stats.shares || 0) + 2 * (stats.saves || 0));
}

function topicComponent(profile, topics, cfg) {
  if (!topics.length) return 0;
  const vals = topics.map((t) => Math.tanh((profile.topicAffinity[t] || 0) / cfg.scale.topic));
  const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
  const extreme = vals.reduce((a, b) => (Math.abs(b) > Math.abs(a) ? b : a), 0);
  return (extreme + mean) / 2;
}

function explain(post, creator, profile, following, cfg) {
  const reasons = [];
  const cAff = profile.creatorAffinity[post.creatorId] || 0;
  const name = creator ? creator.name : 'this creator';
  if (cAff >= 3) {
    reasons.push(following ? `You engage with ${name}` : `You've engaged with ${name}, who you don't follow yet`);
  }
  const bestTopic = [...post.topics]
    .map((t) => [t, profile.topicAffinity[t] || 0])
    .sort((a, b) => b[1] - a[1])[0];
  if (bestTopic && bestTopic[1] >= 2) reasons.push(`You've shown interest in ${bestTopic[0]}`);
  if (cAff <= -3) reasons.push(`You asked to see less from ${name}`);
  const worst = [...post.topics].sort(
    (a, b) => (profile.topicAffinity[a] || 0) - (profile.topicAffinity[b] || 0)
  )[0];
  if (worst && (profile.topicAffinity[worst] || 0) <= -3) reasons.push(`You asked to see less of ${worst}`);
  if (!reasons.length) reasons.push('New and popular right now');
  return reasons;
}

/**
 * Score and sort candidate posts for one user.
 * @returns {Array<{post, score, breakdown, reasons}>} highest score first

function rankFeed({
  profile,
  posts,
  creators = {},
  following = [],
  history = [],
  now = Date.now(),
  limit = 20,
  config = CONFIG,
}) {
  const cfg = config;
  const state = summarizeHistory(history);
  const maxPop = Math.max(1e-9, ...posts.map((p) => popularityRaw(p.stats)));
  const followSet = new Set(following);

  const ranked = posts
    .filter((p) => !(state[p.id] && state[p.id].hidden))
    .map((post) => {
      const cAff = profile.creatorAffinity[post.creatorId] || 0;
      const w = profile.creatorWatch[post.creatorId];
      const ageH = Math.max(0, (now - new Date(post.createdAt).getTime()) / 3.6e6);

        topic: topicComponent(profile, post.topics, cfg),
        watch: w && w.n ? w.sum / w.n : 0,
        engagement:

        freshness: Math.pow(0.5, ageH / cfg.freshnessHalfLifeHours),
      };

      let score = -seenPenalty;
      for (const k of Object.keys(cfg.weights)) {

        score += comp[k] * cfg.weights[k];
      }
      breakdown.seenPenalty = -seenPenalty;

      return {
        post,
        score: round(score, 3),
        breakdown,
        reasons: explain(post, creators[post.creatorId], profile, followSet.has(post.creatorId), cfg),
      };
    })
    .sort(
      (a, b) =>
        b.score - a.score ||
        new Date(b.post.createdAt) - new Date(a.post.createdAt) ||
        (a.post.id < b.post.id ? -1 : 1)
    );

      await send(item, 'skip');
      return leave(c);
    } else if (act === 'menu') {
      return openNotInterestedMenu(c, item, b);
    }
    paintActions(c, item);
  }

  /* ---------- "tell us why" menu: three separate, decoupled options ---------- */
  function closeMenu() {
    document.querySelectorAll('.why-menu').forEach((m) => m.remove());
    document.querySelectorAll('[data-act="menu"][aria-expanded="true"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    document.removeEventListener('click', onOutsideMenuClick, true);
  }
  function onOutsideMenuClick(e) {
    if (!e.target.closest('.why-menu') && !e.target.closest('[data-act="menu"]')) closeMenu();
  }
  function openNotInterestedMenu(card, item, anchorBtn) {
    const alreadyOpenHere = anchorBtn.getAttribute('aria-expanded') === 'true';
    closeMenu();
    if (alreadyOpenHere) return; // tapping the same button again just closes it
    anchorBtn.setAttribute('aria-expanded', 'true');
    const topic = item.topics[0];
    const menu = el('div', 'why-menu');
    menu.innerHTML = `
      <button type="button" data-why="hide"><b>Not interested in this plan</b><small>Just this one, nothing else changes</small></button>
      ${topic ? `<button type="button" data-why="topic"><b>See less: ${esc(topic)}</b><small>Lowers this category, not the creator</small></button>` : ''}
      <button type="button" data-why="creator"><b>See less from ${esc(item.creator.name)}</b><small>Lowers this creator, not the category</small></button>`;
    menu.addEventListener('click', async (e) => {
      const w = e.target.closest('[data-why]');
      if (!w) return;
      const why = w.dataset.why;
      closeMenu();
      if (why === 'hide') await send(item, 'hide_plan');
      else if (why === 'topic') await send(item, 'demote_topic', { topic });
      else if (why === 'creator') await send(item, 'demote_creator');
      leave(card);
    });
    anchorBtn.insertAdjacentElement('afterend', menu);
    // Defer attaching the outside-click listener so the click that OPENED the menu
    // (currently bubbling) doesn't immediately close it.
    setTimeout(() => document.addEventListener('click', onOutsideMenuClick, true), 0);
  }

  function leave(c) {
    stopVideo(c);
    c.style.maxHeight = c.offsetHeight + 'px';
    c.getBoundingClientRect();
    c.classList.add('leaving');
    setTimeout(() => c.remove(), 700);
  }

  /* ---------- video (simulated playback) ---------- */
  function togglePlay(c, item) {
    if (S.timers.has(c)) return finishPlay(c, item, false);
    stopAllVideos();
    let t = 0;
    const btn = c.querySelector('[data-act="play"]');
    btn.innerHTML = ICON.stop;
    btn.setAttribute('aria-label', 'Stop video');
    const bar = c.querySelector('.track i');
    const time = c.querySelector('.time');
    const id = setInterval(() => {
      t = Math.min(item.duration, t + (0.1 * DEMO_SPEED));
      bar.style.width = (t / item.duration) * 100 + '%';
      time.textContent = `${fmtT(t)} / ${fmtT(item.duration)}`;
      S.timers.get(c).t = t;
      if (t >= item.duration) finishPlay(c, item, true);
    }, 100);
    S.timers.set(c, { id, t: 0 });
  }

  async function finishPlay(c, item, completed) {
    const rec = S.timers.get(c);
    if (!rec) return;
    clearInterval(rec.id);
    S.timers.delete(c);
    const btn = c.querySelector('[data-act="play"]');
    if (btn) { btn.innerHTML = ICON.play; btn.setAttribute('aria-label', 'Play video'); }
    const watched = completed ? item.duration : Math.round(rec.t * 10) / 10;
    const again = item.state.watched;
    await send(item, again && completed ? 'rewatch' : 'watch', { watchTime: watched, contentDuration: item.duration });
    item.state.watched = true;
  }
  function stopVideo(c) {
    const rec = S.timers.get(c);
    if (rec) { clearInterval(rec.id); S.timers.delete(c); }
  }
  function stopAllVideos() {
    [...S.timers.keys()].forEach((c) => {
      const item = S.posts[c.dataset.id];
      if (c.isConnected && item) finishPlay(c, item, false); else stopVideo(c);
    });
  }

  /* ---------- views (impressions) ---------- */
  let io;
  function observeViews() {
    if (io) io.disconnect();
    io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        const c = en.target;
        clearTimeout(c._vt);
        if (en.isIntersecting) {
          c._vt = setTimeout(() => {
            const item = S.posts[c.dataset.id];
            if (item && !item.state.viewed) {
              item.state.viewed = true;
              api.interact({ userId: S.userId, postId: item.id, creatorId: item.creator.id, action: 'view' }).then((r) => paintProfile(r.profile, null));
            }
            io.unobserve(c);
          }, 900);
        }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('.card[data-id]').forEach((c) => io.observe(c));
  }

  /* ---------- sending + learning panel ---------- */
  async function send(item, action, extra = {}) {
    try {
      const r = await api.interact({ userId: S.userId, postId: item.id, creatorId: item.creator.id, action, ...extra });
      if (r.ignored) return r;
      S.pending += 1;
      updatePending();
      paintProfile(r.profile, r.deltas);
      addLog(item, action, r.deltas);
      return r;
    } catch (e) {
      $('#hint').textContent = 'Could not record that action: ' + e.message;
    }
  }

  function updatePending() {
    const b = $('#pending');
    b.hidden = S.pending === 0;
    b.textContent = S.pending;
    $('#refresh').classList.toggle('ready', S.pending > 0);
    $('#hint').textContent = S.pending
      ? `Yalla has learned from ${S.pending} new action${S.pending > 1 ? 's' : ''}. Refresh to re-rank.`
      : 'Like, watch or skip a post, then refresh the feed to see it re-rank.';
  }

  const rowsByKey = { creators: new Map(), topics: new Map() };
  function paintBars(container, kind, rows, deltaMap) {
    const box = $(container);
    const map = rowsByKey[kind];
    if (!rows.length) { box.innerHTML = '<p class="empty">Nothing yet. Interact with a post to start.</p>'; map.clear(); return; }
    if (box.querySelector('.empty')) box.innerHTML = '';
    const max = Math.max(12, ...rows.map((r) => Math.abs(r.value)));
    rows.forEach((r) => {
      let row = map.get(r.key);
      if (!row) {
        row = el('div', 'row', `<span class="lbl"></span><div class="track2"><i></i></div><span class="val"></span>`);
        map.set(r.key, row);
        box.appendChild(row);
      }
      row.querySelector('.lbl').innerHTML = esc(r.label) + (kind === 'creators' && !r.following ? ' <small>· not followed</small>' : '');
      const w = (Math.abs(r.value) / max) * 50;
      const fill = row.querySelector('i');
      fill.style.width = w + '%';
      fill.style.left = r.value >= 0 ? '50%' : 50 - w + '%';
      fill.style.background = r.value >= 0 ? 'var(--accent)' : 'var(--neg)';
      const val = row.querySelector('.val');
      val.textContent = signed(r.value);
      val.className = 'val ' + (r.value > 0 ? 'pos' : r.value < 0 ? 'neg' : '');
      const d = deltaMap && deltaMap[r.key];
      if (d) {
        row.querySelector('.delta')?.remove();
        row.appendChild(el('span', 'delta ' + (d > 0 ? 'pos' : 'neg'), signed(d)));
      }
    });
    rows.forEach((r) => box.appendChild(map.get(r.key)));
  }

  function paintProfile(profile, deltas) {
    S.profile = profile;
    paintBars('#creators', 'creators', profile.creatorAffinity, deltas && deltas.creatorDelta && deltas.creatorId ? { [deltas.creatorId]: deltas.creatorDelta } : null);
    paintBars('#topics', 'topics', profile.topicAffinity, deltas && deltas.topicDeltas);
  }

  const VERB = { like: 'Liked', unlike: 'Unliked', watch: 'Watched', rewatch: 'Rewatched', share: 'Shared', save: 'Saved', comment: 'Commented on', skip: 'Skipped', follow: 'Followed', unfollow: 'Unfollowed' };
  function describe(action, creatorName, post, deltas) {
    const what = post ? `${creatorName}'s ${post.topics[0]} ${post.type}` : creatorName;
    if (action === 'follow' || action === 'unfollow') return `${VERB[action]} ${creatorName}`;
    if (action === 'hide_plan') return `Hid ${what} — no score changed`;
    if (action === 'demote_creator') return `Asked to see less from ${creatorName}`;
    if (action === 'demote_topic') {
      const t = (deltas && Object.keys(deltas.topicDeltas || {})[0]) || (post && post.topics[0]);
      return `Asked to see less of ${t}`;
    }
    if (action === 'watch' && deltas && deltas.effective === 'skip') return `Left ${what} almost at once`;
    if (action === 'watch' && deltas && deltas.completion != null) return `Watched ${Math.round(deltas.completion * 100)}% of ${what}`;
    return `${VERB[action]} ${what}`;
  }
  function addLog(item, action, deltas, isNew = true) {
    const ol = $('#log');
    ol.querySelector('.empty')?.remove();
    const parts = [];
    if (deltas) {
      if (deltas.creatorDelta) parts.push(`${deltas.creatorName} ${signed(deltas.creatorDelta)}`);
      Object.entries(deltas.topicDeltas || {}).forEach(([t, d]) => parts.push(`${t} ${signed(d)}`));
      if (!parts.length) parts.push('no score changed');
    }
    const li = el('li', isNew ? 'new' : '', `${esc(describe(action, item.creator.name, item, deltas))}<span class="d">${esc(parts.join(' · '))}</span>`);
    ol.prepend(li);
    while (ol.children.length > 8) ol.lastChild.remove();
  }

  async function loadActivity() {
    const ol = $('#log');
    ol.innerHTML = '';
    const rows = await api.activity(S.userId);
    if (!rows.length) { ol.innerHTML = '<li class="empty">No actions yet.</li>'; return; }
    rows.slice().reverse().forEach((r) => {
      const post = S.posts[r.postId];
      const li = el('li', '', esc(describe(r.action, r.creatorName, post, null)));
      ol.prepend(li);
    });
  }

  /* ---------- boot ---------- */
  async function switchUser(id) {
    S.userId = id;
    S.prevRank = null;
    rowsByKey.creators.clear(); rowsByKey.topics.clear();
    $('#creators').innerHTML = ''; $('#topics').innerHTML = '';
    await loadFeed();
    paintProfile(await api.profile(id), null);
    await loadActivity();
  }

  async function init() {
    const users = await api.users();
    const sel = $('#user');
    sel.innerHTML = users.map((u) => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
    sel.addEventListener('change', () => switchUser(sel.value));
    $('#refresh').addEventListener('click', () => loadFeed({ animate: true }));
    $('#reset').addEventListener('click', async () => {
      await api.reset(S.userId);
      await switchUser(S.userId);
    });
    if (matchMedia('(max-width: 900px)').matches) $('#learnedbox').open = false;
    await switchUser(users[0].id);
  }
  init().catch((e) => { $('#hint').textContent = 'Could not load the feed: ' + e.message; });
})();

</script>
</body>
</html>
